name: Life maintenance calendar
description: Build an .ics calendar from a plain-text life.yml task file.
author: Nicole Yang
branding:
  icon: calendar
  color: green

inputs:
  file:
    description: Path to the task file.
    default: life.yml
  output:
    description: Where to write the .ics file.
    default: life.ics

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install lifecal
      shell: bash
      run: python -m pip install --quiet "$ACTION_PATH"
      env:
        ACTION_PATH: ${{ github.action_path }}
    - name: Build calendar
      shell: bash
      run: lifecal build "$INPUT_FILE" --output "$INPUT_OUTPUT"
      env:
        INPUT_FILE: ${{ inputs.file }}
        INPUT_OUTPUT: ${{ inputs.output }}
